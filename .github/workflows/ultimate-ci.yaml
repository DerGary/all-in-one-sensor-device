name: Ultimate

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'Ultimate/**'
      - 'sensors/**'
      - 'lang/**'
      - 'automations/**'
      - 'components/**'
      - .github/workflows/ultimate-ci.yaml
  push:
    tags:
      - "ultimate*"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: node:26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
            apt-get update
            apt-get install -y chromium fonts-noto-color-emoji

      - name: Install md-to-pdf globally
        run: npm i -g md-to-pdf

      - name: Run PDF render script
        working-directory: Ultimate/instructions
        run: |
          chmod +x ./renderPdf.sh
          ./renderPdf.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ultimate-instructions-pdf
          path: ./Ultimate/instructions/ultimate-instructions.pdf
          if-no-files-found: error

  build-bin:
    runs-on: ubuntu-latest
    container:
      image: esphome/esphome:2026.6
    strategy:
      fail-fast: false
      matrix:
        lang: [de, en]
        temp: [sht4x, bme280]
        connectivity: [wifi_improv, thread]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/ultimate*)
              VERSION="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              VERSION="ultimate-dev.${{ github.run_number }}"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile firmware
        run: |
          esphome -s lang ${{ matrix.lang }} -s temp ${{ matrix.temp }} -s connectivity ${{ matrix.connectivity }} -s version ${{ steps.version.outputs.version }} compile Ultimate/device.yaml

      # openthread_tlv compiled into firmware, no post-flash provisioning like esp32_improv -
      # thread variant compiled here as build check only, never collected/uploaded/released.
      - name: Collect and rename binaries
        if: matrix.connectivity != 'thread'
        run: |
          mkdir -p output

          BASE_NAME="firmware_${{ matrix.temp }}_${{ matrix.lang }}_${{ steps.version.outputs.version }}"

          OTA_PATH=$(find Ultimate/.esphome/build/ -name "firmware.ota.bin" | head -n 1)
          cp "$OTA_PATH" "output/${BASE_NAME}_ota.bin"

          FACTORY_PATH=$(find Ultimate/.esphome/build/ -name "firmware.factory.bin" | head -n 1)
          cp "$FACTORY_PATH" "output/${BASE_NAME}_factory.bin"

      - name: Upload artifacts for this matrix run
        if: matrix.connectivity != 'thread'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.temp }}-${{ matrix.lang }}
          path: output/*.bin

  release:
    needs:
      - build-bin
      - build-pdf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/ultimate')

    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Rename Instructions
        working-directory: all-artifacts
        run: mv ultimate-instructions.pdf ${{ github.ref_name }}-instructions.pdf

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          files: all-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

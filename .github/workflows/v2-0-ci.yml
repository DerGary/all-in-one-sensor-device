name: V2.0

on:
  pull_request:
    branches: ["main"]
  push:
    tags:
      - "v2.0*"

jobs:
  # Runs unconditionally (no `paths:` filter on the trigger) so this workflow always
  # posts a check on every PR - required status checks would otherwise wait forever
  # on a PR that never touches these paths. Path relevance is filtered here instead,
  # and build-pdf/build-bin are skipped (not un-triggered) when irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - 'V2/**'
              - .github/workflows/v2-0-ci.yml

  build-pdf:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
            apt-get update
            apt-get install -y chromium fonts-noto-color-emoji
            
      - name: Install md-to-pdf globally
        run: npm i -g md-to-pdf

      - name: Run PDF render script
        working-directory: V2/instructions
        run: |
          chmod +x ./renderPdf.sh
          ./renderPdf.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2-instructions-pdf
          path: ./V2/instructions/v2-instructions.pdf
          if-no-files-found: error

  build-bin:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    container:
      image: esphome/esphome:2026.7
    strategy:
      fail-fast: false
      matrix:
        variant: [esp32, esp32supermini]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compile firmware
        run: |
          esphome -s apikey "0HkBGFr/oAHaBGVJue84kroMi9UUI+9x/R7dBaUF354=" compile V2/${{ matrix.variant }}.yaml

  # Always runs (even when build-pdf/build-bin were skipped as not relevant) so it can
  # be set as the required status check in branch protection.
  v20-ci-gate:
    name: V2.0 CI Gate
    runs-on: ubuntu-latest
    needs: [changes, build-pdf, build-bin]
    if: always()
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build-pdf.result }}" = "failure" ] || [ "${{ needs.build-bin.result }}" = "failure" ]; then
            echo "V2.0 CI failed"
            exit 1
          fi
          echo "V2.0 CI passed (or not relevant to this PR)"

  release-pdf:
    needs: build-pdf
    if: startsWith(github.ref, 'refs/tags/v2.0') 
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - name: Download PDF Artifact
        uses: actions/download-artifact@v8
        with:
          name: v2-instructions-pdf
          path: .

      - name: Rename Instructions
        run: mv v2-instructions.pdf ${{ github.ref_name }}-instructions.pdf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.ref_name }}-instructions.pdf
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true


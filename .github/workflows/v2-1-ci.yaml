name: V2.1

on:
  pull_request:
    branches: ["main"]
  push:
    tags:
      - "v2.1*"

jobs:
  # Runs unconditionally (no `paths:` filter on the trigger) so this workflow always
  # posts a check on every PR - required status checks would otherwise wait forever
  # on a PR that never touches these paths. Path relevance is filtered here instead,
  # and build-pdf/build-bin are skipped (not un-triggered) when irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - 'V2.1/**'
              - 'sensors/**'
              - 'lang/**'
              - 'automations/**'
              - .github/workflows/v2-1-ci.yaml

  build-pdf:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    container:
      image: node:26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
            apt-get update
            apt-get install -y chromium fonts-noto-color-emoji
            
      - name: Install md-to-pdf globally
        run: npm i -g md-to-pdf

      - name: Run PDF render script
        working-directory: V2.1/instructions
        run: |
          chmod +x ./renderPdf.sh
          ./renderPdf.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2.1-instructions-pdf
          path: ./V2.1/instructions/v2.1-instructions.pdf
          if-no-files-found: error

  build-bin:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    container:
      # Keep the version in the cache keys below in sync with this image tag
      image: esphome/esphome:2026.7
    strategy:
      fail-fast: false
      matrix:
        # Every build is listed explicitly: only combinations that match real hardware are built.
        include:
          # V2.1 case: HC-SR501 + BME680/BME280
          - { lang: de, temp: bme680, variant: esp32, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: en, temp: bme680, variant: esp32, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: de, temp: bme680, variant: esp32c6, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: en, temp: bme680, variant: esp32c6, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: de, temp: bme280, variant: esp32, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: en, temp: bme280, variant: esp32, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: de, temp: bme280, variant: esp32c6, connectivity: wifi_improv, motion: hc-sr501 }
          - { lang: en, temp: bme280, variant: esp32c6, connectivity: wifi_improv, motion: hc-sr501 }
          # Flush-mount insert for deep hollow-wall boxes: SHT41 + Panasonic EKMC on a C6
          - { lang: de, temp: sht4x, variant: esp32c6, connectivity: wifi_improv, motion: ekmc_motion }
          - { lang: en, temp: sht4x, variant: esp32c6, connectivity: wifi_improv, motion: ekmc_motion }
          # OpenThread: one compile check only, so PRs can't break it. Never released (the dataset is
          # compiled in and thread builds can't be updated over the air); needs the esp32c6 radio.
          - { lang: de, temp: bme680, variant: esp32c6, connectivity: thread, motion: hc-sr501 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ESPHome downloads ESP-IDF and its toolchains into ~/.cache/esphome (HOME is /github/home
      # in container jobs); that only depends on the ESPHome version and the chip. The build
      # directory holds the compiled objects, so only changed sources are rebuilt.
      # Fixed keys: saved once per ESPHome version and build, refreshed by the next ESPHome bump.
      - name: Cache ESP-IDF framework and toolchains
        uses: actions/cache@v6
        with:
          path: /github/home/.cache/esphome
          key: v21-idf-2026.7-${{ matrix.variant }}

      - name: Cache ESPHome build directory
        uses: actions/cache@v6
        with:
          path: V2.1/.esphome
          key: v21-build-2026.7-${{ matrix.variant }}-${{ matrix.temp }}-${{ matrix.motion }}-${{ matrix.connectivity }}-${{ matrix.lang }}

      - name: Determine version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v2.1*)
              VERSION="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              VERSION="v2.1-dev.${{ github.run_number }}"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile firmware
        run: |
          esphome -s lang ${{ matrix.lang }} -s temp ${{ matrix.temp }} -s motion ${{ matrix.motion }} -s variant ${{ matrix.variant }} -s connectivity ${{ matrix.connectivity }} -s version ${{ steps.version.outputs.version }} compile V2.1/device.yaml

      # The openthread_tlv is compiled into the firmware and there is no post-flash
      # provisioning like esp32_improv for WiFi, so the thread variant is only ever
      # compiled here as a build check - never collected, uploaded, or released, to
      # avoid anyone flashing a binary carrying the CHANGEME placeholder TLV.
      - name: Collect and rename binaries
        if: matrix.connectivity != 'thread'
        run: |
          mkdir -p output

          BASE_NAME="firmware_${{ matrix.variant }}_${{ matrix.temp }}${{ matrix.motion != 'hc-sr501' && format('_{0}', matrix.motion) || '' }}_${{ matrix.lang }}_${{ steps.version.outputs.version }}"

          OTA_PATH=$(find V2.1/.esphome/build/ -name "firmware.ota.bin" | head -n 1)
          cp "$OTA_PATH" "output/${BASE_NAME}_ota.bin"

          FACTORY_PATH=$(find V2.1/.esphome/build/ -name "firmware.factory.bin" | head -n 1)
          cp "$FACTORY_PATH" "output/${BASE_NAME}_factory.bin"

      - name: Upload artifacts for this matrix run
        if: matrix.connectivity != 'thread'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.variant }}-${{ matrix.temp }}${{ matrix.motion != 'hc-sr501' && format('-{0}', matrix.motion) || '' }}-${{ matrix.lang }}
          path: output/*.bin

  # Always runs (even when build-pdf/build-bin were skipped as not relevant) so it can
  # be set as the required status check in branch protection.
  v21-ci-gate:
    name: V2.1 CI Gate
    runs-on: ubuntu-latest
    needs: [changes, build-pdf, build-bin]
    if: always()
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build-pdf.result }}" = "failure" ] || [ "${{ needs.build-bin.result }}" = "failure" ]; then
            echo "V2.1 CI failed"
            exit 1
          fi
          echo "V2.1 CI passed (or not relevant to this PR)"

  release:
    needs:
      - build-bin
      - build-pdf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v2.1')
    
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true # Flattens all artifacts into a single folder

      - name: Rename Instructions
        working-directory: all-artifacts
        run: mv v2.1-instructions.pdf ${{ github.ref_name }}-instructions.pdf

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          files: all-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
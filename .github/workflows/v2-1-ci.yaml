name: V2.1

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'V2.1/**'
      - 'sensors/**'
      - 'lang/**'
      - 'automations/**'
      - .github/workflows/v2-1-ci.yml
  push:
    tags:
      - "v2.1*"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: node:26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
            apt-get update
            apt-get install -y chromium fonts-noto-color-emoji
            
      - name: Install md-to-pdf globally
        run: npm i -g md-to-pdf

      - name: Run PDF render script
        working-directory: V2.1/instructions
        run: |
          chmod +x ./renderPdf.sh
          ./renderPdf.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2.1-instructions-pdf
          path: ./V2.1/instructions/v2.1-instructions.pdf
          if-no-files-found: error

  build-bin:
    runs-on: ubuntu-latest
    container:
      image: esphome/esphome:stable
    strategy:
      fail-fast: false
      matrix:
        lang: [de, en]
        temp: [bme680, bme280]
        variant: [esp32, esp32c6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Compile firmware
        run: |
          esphome -s lang ${{ matrix.lang }} -s temp ${{ matrix.temp }} -s variant ${{ matrix.variant }} compile V2.1/uni.yaml

      - name: Collect and rename binaries
        run: |
          mkdir -p output
          
          # Generate a unique base name (e.g., firmware_esp32c6_bme680_de)
          BASE_NAME="firmware_${{ matrix.variant }}_${{ matrix.temp }}_${{ matrix.lang }}_V2.1.${{ github.run_number }}"
          
          # 1. Locate and copy the standard OTA file
          OTA_PATH=$(find V2.1/.esphome/build/ -name "firmware.bin" | head -n 1)
          cp "$OTA_PATH" "output/${BASE_NAME}_ota.bin"
          
          # 2. Locate and copy the factory file (PlatformIO uses *-factory.bin, ESP-IDF uses *.factory.bin)
          FACTORY_PATH=$(find V2.1/.esphome/build/ -name "*factory*.bin" | head -n 1)
          if [ -n "$FACTORY_PATH" ]; then
            cp "$FACTORY_PATH" "output/${BASE_NAME}_factory.bin"
          else
            # Fallback if the framework structure matches OTA
            cp "$OTA_PATH" "output/${BASE_NAME}_factory.bin"
          fi

      - name: Upload artifacts for this matrix run
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.variant }}-${{ matrix.temp }}-${{ matrix.lang }}
          path: output/*.bin

  release:
    needs: 
      - build-bin
      - build-pdf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v2.1')
    
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true # Flattens all artifacts into a single folder

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          files: all-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
name: V2.1

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'V2.1/**'
      - 'sensors/**'
      - 'lang/**'
      - 'automations/**'
      - .github/workflows/v2-1-ci.yaml
  push:
    tags:
      - "v2.1*"

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    container:
      image: node:26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: |
            apt-get update
            apt-get install -y chromium fonts-noto-color-emoji
            
      - name: Install md-to-pdf globally
        run: npm i -g md-to-pdf

      - name: Run PDF render script
        working-directory: V2.1/instructions
        run: |
          chmod +x ./renderPdf.sh
          ./renderPdf.sh

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v7
        with:
          name: v2.1-instructions-pdf
          path: ./V2.1/instructions/v2.1-instructions.pdf
          if-no-files-found: error

  build-bin:
    runs-on: ubuntu-latest
    container:
      image: esphome/esphome:2026.6
    strategy:
      fail-fast: false
      matrix:
        lang: [de, en]
        temp: [bme680, bme280]
        variant: [esp32, esp32c6]
        connectivity: [wifi_improv, thread]
        exclude:
          # OpenThread requires the esp32c6's 802.15.4 radio
          - variant: esp32
            connectivity: thread

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v2.1*)
              VERSION="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              VERSION="v2.1-dev.${{ github.run_number }}"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compile firmware
        run: |
          esphome -s lang ${{ matrix.lang }} -s temp ${{ matrix.temp }} -s variant ${{ matrix.variant }} -s connectivity ${{ matrix.connectivity }} -s version ${{ steps.version.outputs.version }} compile V2.1/device.yaml

      # The openthread_tlv is compiled into the firmware and there is no post-flash
      # provisioning like esp32_improv for WiFi, so the thread variant is only ever
      # compiled here as a build check - never collected, uploaded, or released, to
      # avoid anyone flashing a binary carrying the CHANGEME placeholder TLV.
      - name: Collect and rename binaries
        if: matrix.connectivity != 'thread'
        run: |
          mkdir -p output

          BASE_NAME="firmware_${{ matrix.variant }}_${{ matrix.temp }}_${{ matrix.lang }}_${{ steps.version.outputs.version }}"

          OTA_PATH=$(find V2.1/.esphome/build/ -name "firmware.ota.bin" | head -n 1)
          cp "$OTA_PATH" "output/${BASE_NAME}_ota.bin"

          FACTORY_PATH=$(find V2.1/.esphome/build/ -name "firmware.factory.bin" | head -n 1)
          cp "$FACTORY_PATH" "output/${BASE_NAME}_factory.bin"

      - name: Upload artifacts for this matrix run
        if: matrix.connectivity != 'thread'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.variant }}-${{ matrix.temp }}-${{ matrix.lang }}
          path: output/*.bin

  release:
    needs: 
      - build-bin
      - build-pdf
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v2.1')
    
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-artifacts
          merge-multiple: true # Flattens all artifacts into a single folder

      - name: Rename Instructions
        working-directory: all-artifacts
        run: mv v2.1-instructions.pdf ${{ github.ref_name }}-instructions.pdf

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v3
        with:
          files: all-artifacts/*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
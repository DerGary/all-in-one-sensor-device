esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  includes:
    - "<esphome/components/network/util.h>"

esp32:
  variant: ${variant}
  framework:
    type: esp-idf

## Enables logging, eats ram, only enable if necessary.
# logger:
#   level: DEBUG

## Enables the Home Assistant API
api:
  id: api_id
  encryption: # Uses key set by Home Assistant
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

## Enables to update the firmware over the air
ota:
  - platform: esphome
  - platform: web_server

sensor:
  ## this will report the uptime of the device. If your device reboots unexpectedly you can see it in this value.
  - platform: uptime
    type: seconds
    name: ${label_uptime}
    update_interval: 60s
    icon: mdi:timer-outline

  ## this will report the free memory. If your device reboots unexpectedly it may be because there is not enough free memory. In my experience there must be at least 40-50kb available at all times for reliable operation.
  - platform: template
    name: ${label_free_mem}
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    icon: "mdi:memory"
    entity_category: diagnostic
    state_class: measurement
    unit_of_measurement: "b"
    update_interval: 60s
    disabled_by_default: true

binary_sensor:
  ## this reports whether the device is online.
  - platform: status
    icon: mdi:chip
    name: "${friendly_name} Status"

text_sensor:
  ## reports the firmware version set in this device's device.yaml, so it's visible
  ## in Home Assistant without checking the flashed binary's filename.
  - platform: template
    name: ${label_firmware}
    icon: mdi:tag-outline
    entity_category: diagnostic
    lambda: return {"${version}"};

## These values are necessary to calibrate the sensor.
number:
  - platform: template
    name: "${label_temperature} ${label_offset}"
    id: temperature_offset
    optimistic: true
    min_value: -100
    max_value: 100
    step: 0.1
    restore_value: true
    initial_value: 0.0
    unit_of_measurement: °C
    icon: mdi:thermometer-plus
    entity_category: config
  - platform: template
    name: "${label_humidity} ${label_offset}"
    id: humidity_offset
    optimistic: true
    min_value: -100
    max_value: 100
    step: 0.1
    restore_value: true
    initial_value: 0.0
    unit_of_measurement: "%"
    icon: mdi:water-plus
    entity_category: config

button:
  ## This button can be used to restart the device
  - platform: restart
    name: ${label_restart}
    icon: mdi:restart

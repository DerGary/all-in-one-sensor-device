substitutions:
  lang: en
  temp: sht4x
  variant: esp32c6
  ## Shown in HA as the Firmware text sensor. CI overrides this via `-s version`,
  ## derived from the git tag (e.g. ultimate-v1.0.1) on release builds. Keep this
  ## default in sync with the latest entry in instructions/changelog.md for local builds.
  version: "1.0.4"
  ## connectivity: wifi_improv (BLE-provisioned WiFi) or thread (OpenThread)
  connectivity: wifi_improv
  ## only used when connectivity: thread. openthread_tlv is compiled into the firmware -
  ## there is no post-flash provisioning like esp32_improv for WiFi, so CI only ever
  ## compiles the thread variant as a build check with this CHANGEME placeholder and
  ## never releases/attaches it. To actually use OpenThread, build locally with your own
  ## TLV: `esphome -s connectivity thread -s openthread_tlv <your-tlv> ...`
  ## Get your OTBR dataset TLV from Home Assistant under Devices -> "Thread" integration
  ## -> Configure -> preferred network -> info (the little i icon).
  openthread_tlv: CHANGEME

packages:
  common: !include
    file: ../common.yaml
    vars:
      friendly_name: Ultimate Sensor # the friendly name of your device, can be anything.
      device_name: ultimate-sensor # the name of your device. It should not contain any special characters or whitespaces. the device can be found in the network by this name.

  connectivity: !include "../connectivity/${connectivity}.yaml"

  lang: !include "../lang/${lang}.yaml"

  temperature: !include "../sensors/${temp}.yaml"

  motion: !include
    file: ../sensors/ekmc_motion.yaml
    vars:
      pin: GPIO7
  illuminance: !include ../sensors/bh1750.yaml
  ld2450: !include
    file: ../sensors/ld2450.yaml
    vars:
      tx_pin: GPIO16
      rx_pin: GPIO17
  co2: !include
    file: ../sensors/scd4x.yaml
  voc: !include
    file: ../sensors/sgp30.yaml
  led: !include
    file: ../sensors/ws2812.yaml
    vars:
      pin: GPIO21
  c4001: !include
    file: ../sensors/c4001.yaml
    vars:
      tx_pin: GPIO22
      rx_pin: GPIO23
      components_path: ../components
  set_air_quality: !include ../automations/set_air_quality_status_sgp_scd.yaml
  status_led: !include
    file: ../automations/status_led.yaml
    vars:
      sensor: sgp_scd

web_server:
  version: 3
  port: 80
  local: true
  sorting_groups:
    - id: ld2450_group
      name: "LD2450"
      sorting_weight: 10
    - id: c4001_group
      name: "C4001"
      sorting_weight: 20

i2c:
  sda: GPIO19
  scl: GPIO20
  scan: true

binary_sensor:
  - platform: template
    name: ${label_presence}
    lambda: return id(c4001_presence).state || id(ld2450_presence).state;
    icon: mdi:account-eye-outline
    device_class: presence
    id: presence
    on_state:
      then:
        - script.execute: set_occupied

script:
  - id: set_air_quality_status
    then:
      - lambda: |-
          if (int(id(iaq).state) >= 200) {
            id(air_quality_status).publish_state("${label_air_quality_critical}");
          } else if (int(id(iaq).state) >= 150) {
            id(air_quality_status).publish_state("${label_air_quality_warning}");
          } else {
            id(air_quality_status).publish_state("${label_air_quality_good}");
          }

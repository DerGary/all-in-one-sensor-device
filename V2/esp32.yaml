substitutions:
  friendly_name: CHANGEME # the friendly name of your device, can be anything.
  apikey: !secret api-key

esphome:
  name: changeme # the name of your device. It should not contain any special characters or whitespaces. the device can be found in the network by this name.
  friendly_name: ${friendly_name}
  #area: CHANGEME # the area where you deployed the device. optional

packages:
  common: !include
    file: ./common.yaml
    vars:
      temperature_offset_initial_value: 0.0
      humidity_offset_initial_value: 0.0
      password: !secret password
      api_key: ${apikey}
      wifi_ssid: !secret wifi-ssid
      wifi_password: !secret wifi-password
      variant: esp32

  ## choose your connectivity by uncommenting the correct block (only one at a time).
  ## WiFi: includes BLE tracker and Bluetooth proxy. Set credentials in secrets.yaml.
  connectivity: !include
    file: ../connectivity/wifi.yaml
    vars:
      wifi_output_power: 8.5dB
      wifi_ssid: !secret wifi-ssid
      wifi_password: !secret wifi-password
      username: !secret username
      password: !secret password

  ## OpenThread (Thread/Matter): no WiFi or BLE proxy. Set your OTBR dataset TLV in secrets.yaml.
  # connectivity: !include
  #   file: ../connectivity/thread.yaml
  #   vars:
  #     openthread_tlv: !secret openthread-tlv

  ## choose which language you are using by uncommenting the correct line
  # lang: !include ../lang/de.yaml
  lang: !include ../lang/en.yaml

  ## choose which sensor you are using by uncommenting the correct line
  # bme680: !include
  #   file: ../sensors/bme680.yaml
  #   vars:
  #     bme680_temperature_offset: 5.8 # this can be changed to calibrate the sensor.

  bme280: !include ../sensors/bme280.yaml

  motion: !include
    file: ../sensors/hc-sr501.yaml
    vars:
      pin: GPIO27
  illuminance: !include ../sensors/bh1750.yaml
  presence: !include
    file: ../sensors/ld2410.yaml
    vars:
      tx_pin: GPIO16
      rx_pin: GPIO17
  script_dummies: !include ../automations/script_dummies.yaml

## setup the i2c bus and define the pins to use.
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf

## Remove this if you don't want to track bluetooth device presence.
esp32_ble_tracker:
  scan_parameters:
    active: True # Whether to send scan-request packets to devices to gather more info (like devicename)
    interval: 211ms # suggested 211ms # default 320ms
    window: 30ms # suggested 120ms # default 30ms

## Remove this if you don't need to expand your home assistants bluetooth range
bluetooth_proxy:
  active: true

## Enables logging, eats ram, only enable if necessary.
# logger:
#   level: DEBUG

## should be disabled when BT Proxy is on due to memory consumption, may be necessary to debug issues
web_server:
  port: 80
  auth:
    username: ${username}
    password: ${password}
  local: true

## Enables the Home Assistant API
api:
  encryption:
    key: ${api_key}

## Enables to update the firmware over the air
ota:
  - platform: esphome
    password: ${password}

wifi:
  output_power: ${wifi_output_power}
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ESP Fallback Hotspot
    password: ${password}

## adds support to choose your wifi through the esp fallback hotspot
captive_portal:

sensor:
  ## this will report the uptime of the device. If your device reboots unexpectedly you can see it in this value.
  - platform: uptime
    type: seconds
    name: ${label_uptime}
    update_interval: 60s
    icon: mdi:timer-outline

  ## this will report the free memory. If your device reboots unexpectedly it may be because there is not enough free memory. In my experience there must be at least 40-50kb available at all times for reliable operation.
  - platform: template
    name: ${label_free_mem}
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    icon: "mdi:memory"
    entity_category: diagnostic
    state_class: measurement
    unit_of_measurement: "b"
    update_interval: 60s
    disabled_by_default: true

  ## this reports the wifi signal strength of your wifi access point. If you want to reduce or increase your wifi output power of your access point you can use this value for reference. This value does not reflect the output power of the esp device, but the output power of the wifi access point.
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    disabled_by_default: true
    name: ${label_wifi_signal}
    id: wifi_signal_db
    update_interval: 1s
    entity_category: "diagnostic"

binary_sensor:
  ## this reports wether the device is online.
  - platform: status
    icon: mdi:chip
    name: "${friendly_name} Status"

## These values are necessary to calibrate the sensor.
number:
  - platform: template
    name: "${label_temperature} ${label_offset}"
    id: temperature_offset
    optimistic: true
    min_value: -100
    max_value: 100
    step: 0.1
    restore_value: true
    initial_value: ${temperature_offset_initial_value}
    unit_of_measurement: °C
    icon: mdi:thermometer-plus
  - platform: template
    name: "${label_air_pressure} ${label_offset}"
    id: humidity_offset
    optimistic: true
    min_value: -100
    max_value: 100
    step: 0.1
    restore_value: true
    initial_value: ${humidity_offset_initial_value}
    unit_of_measurement: "%"
    icon: mdi:water-plus

button:
  ## I use this button together with an automation to regularly restart the device. This helps in reliability.
  - platform: restart
    name: ${label_restart}
    icon: mdi:restart

# Pinned to a contributor's fork branch instead of the official v1.0.6 release: upstream doesn't
# compile against current ESPHome (removed `sensor::Sensor::unit_of_measurement_`, see
# https://github.com/TillFleisch/ESPHome-HLK-LD2450/issues/41). This fork branch carries the fix
# from the still-open https://github.com/TillFleisch/ESPHome-HLK-LD2450/pull/44. Switch back to
# the official repo once that PR is merged and released.
external_components:
  - source: github://flo-rian/ESPHome-HLK-LD2450@pr/esphome-2026-compat

uart:
  - id: ld2450_uart
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

# Each zone's polygon is entered as a single text entity in HA, formatted as "x1,y1;x2,y2;x3,y3;..."
# (meters, at least 3 points). This allows arbitrary polygons - not just a fixed number of corners -
# without needing a number entity per point. The polygon lambda re-parses the text every 30 seconds,
# so editing it in HA reshapes the zone within half a minute. Unparsable or invalid
# (non-convex/duplicate-point/too-short) polygons are ignored by the component and the previous
# valid polygon is kept, so a zone can never end up in a broken state while typing.
LD2450:
  uart_id: ld2450_uart
  name: "LD2450"
  flip_x_axis: false
  fast_off_detection: false
  max_distance_margin: 25cm
  max_detection_distance:
    name: LD2450 ${label_max} ${label_distance}
    initial_value: 6.0m
    step: 0.1m
    restore_value: true
    entity_category: config
    web_server:
      sorting_group_id: ld2450_group
  max_detection_tilt_angle:
    name: LD2450 ${label_max} ${label_angle}
    initial_value: 90°
    step: 1°
    restore_value: true
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ld2450_group
  min_detection_tilt_angle:
    name: LD2450 ${label_min} ${label_angle}
    initial_value: -90°
    step: 1°
    restore_value: true
    entity_category: config
    disabled_by_default: true
    web_server:
      sorting_group_id: ld2450_group
  occupancy:
    id: ld2450_presence
    name: LD2450 ${label_presence}
    disabled_by_default: true
    icon: mdi:account-eye-outline
    web_server:
      sorting_group_id: ld2450_group
  target_count:
    name: LD2450 ${label_presence_target} ${label_count}
    disabled_by_default: true
    web_server:
      sorting_group_id: ld2450_group
  restart_button:
    name: LD2450 ${label_restart}
    entity_category: diagnostic
    disabled_by_default: true
    icon: mdi:restart-alert
    web_server:
      sorting_group_id: ld2450_group
  factory_reset_button:
    name: LD2450 ${label_factory_defaults}
    icon: mdi:factory
    disabled_by_default: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: ld2450_group
  tracking_mode_switch:
    name: LD2450 ${label_multi_target_tracking}
    web_server:
      sorting_group_id: ld2450_group
  bluetooth_switch:
    name: LD2450 ${label_bluetooth_mode}
    icon: mdi:bluetooth
    disabled_by_default: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: ld2450_group
  targets:
    - target:
        name: "LD2450"
        x_position:
          id: ld2450_target_1_x
          name: "${label_target}-1 X ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        y_position:
          id: ld2450_target_1_y
          name: "${label_target}-1 Y ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        speed:
          id: ld2450_target_1_speed
          name: "${label_target}-1 ${label_speed}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance_resolution:
          id: ld2450_target_1_resolution
          name: "${label_target}-1 ${label_distance_resolution}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        angle:
          id: ld2450_target_1_angle
          name: "${label_target}-1 ${label_angle}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance:
          id: ld2450_target_1_distance
          name: "${label_target}-1 ${label_distance}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
    - target:
        name: "LD2450"
        x_position:
          id: ld2450_target_2_x
          name: "${label_target}-2 X ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        y_position:
          id: ld2450_target_2_y
          name: "${label_target}-2 Y ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        speed:
          id: ld2450_target_2_speed
          name: "${label_target}-2 ${label_speed}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance_resolution:
          id: ld2450_target_2_resolution
          name: "${label_target}-2 ${label_distance_resolution}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        angle:
          id: ld2450_target_2_angle
          name: "${label_target}-2 ${label_angle}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance:
          id: ld2450_target_2_distance
          name: "${label_target}-2 ${label_distance}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
    - target:
        name: "LD2450"
        x_position:
          id: ld2450_target_3_x
          name: "${label_target}-3 X ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        y_position:
          id: ld2450_target_3_y
          name: "${label_target}-3 Y ${label_position}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        speed:
          id: ld2450_target_3_speed
          name: "${label_target}-3 ${label_speed}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance_resolution:
          id: ld2450_target_3_resolution
          name: "${label_target}-3 ${label_distance_resolution}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        angle:
          id: ld2450_target_3_angle
          name: "${label_target}-3 ${label_angle}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
        distance:
          id: ld2450_target_3_distance
          name: "${label_target}-3 ${label_distance}"
          disabled_by_default: true
          web_server:
            sorting_group_id: ld2450_group
  zones:
    - zone:
        id: ld2450_zone_1
        name: "LD2450"
        polygon:
          update_interval: 30s
          lambda: !lambda |-
            std::vector<ld2450::Point> points;
            std::string s = id(ld2450_zone1_polygon).state;
            size_t pos = 0;
            while (pos < s.size()) {
              size_t semi = s.find(';', pos);
              std::string token = s.substr(pos, semi == std::string::npos ? std::string::npos : semi - pos);
              size_t comma = token.find(',');
              if (comma == std::string::npos) { points.clear(); break; }
              const char *xstr = token.c_str();
              char *end;
              float x = strtof(xstr, &end);
              if (end == xstr) { points.clear(); break; }
              const char *ystr = token.c_str() + comma + 1;
              float y = strtof(ystr, &end);
              if (end == ystr) { points.clear(); break; }
              points.push_back(ld2450::Point((int)(x * 1000), (int)(y * 1000)));
              if (semi == std::string::npos) break;
              pos = semi + 1;
            }
            return points;
        occupancy:
          id: ld2450_zone_1_occupancy
          name: "${label_zone}-1 ${label_occupied}"
          web_server:
            sorting_group_id: ld2450_group
        target_count:
          id: ld2450_zone_1_target_count
          name: "${label_zone}-1 ${label_count}"
          accuracy_decimals: 0
          web_server:
            sorting_group_id: ld2450_group
    - zone:

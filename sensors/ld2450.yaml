            std::string s = id(ld2450_zone2_polygon).state;
            size_t pos = 0;
            while (pos < s.size()) {
              size_t semi = s.find(';', pos);
              std::string token = s.substr(pos, semi == std::string::npos ? std::string::npos : semi - pos);
              size_t comma = token.find(',');
              if (comma == std::string::npos) { points.clear(); break; }
              const char *xstr = token.c_str();
              char *end;
              float x = strtof(xstr, &end);
              if (end == xstr) { points.clear(); break; }
              const char *ystr = token.c_str() + comma + 1;
              float y = strtof(ystr, &end);
              if (end == ystr) { points.clear(); break; }
              points.push_back(ld2450::Point((int)(x * 1000), (int)(y * 1000)));
              if (semi == std::string::npos) break;
              pos = semi + 1;
            }
            return points;
        occupancy:
          id: ld2450_zone_2_occupancy
          name: "${label_zone}-2 ${label_occupied}"
          web_server:
            sorting_group_id: ld2450_group
        target_count:
          id: ld2450_zone_2_target_count
          name: "${label_zone}-2 ${label_count}"
          accuracy_decimals: 0
          web_server:
            sorting_group_id: ld2450_group
    - zone:
        id: ld2450_zone_3
        name: "LD2450"
        polygon:
          update_interval: 30s
          lambda: !lambda |-
            std::vector<ld2450::Point> points;
            std::string s = id(ld2450_zone3_polygon).state;
            size_t pos = 0;
            while (pos < s.size()) {
              size_t semi = s.find(';', pos);
              std::string token = s.substr(pos, semi == std::string::npos ? std::string::npos : semi - pos);
              size_t comma = token.find(',');
              if (comma == std::string::npos) { points.clear(); break; }
              const char *xstr = token.c_str();
              char *end;
              float x = strtof(xstr, &end);
              if (end == xstr) { points.clear(); break; }
              const char *ystr = token.c_str() + comma + 1;
              float y = strtof(ystr, &end);
              if (end == ystr) { points.clear(); break; }
              points.push_back(ld2450::Point((int)(x * 1000), (int)(y * 1000)));
              if (semi == std::string::npos) break;
              pos = semi + 1;
            }
            return points;
        occupancy:
          id: ld2450_zone_3_occupancy
          name: "${label_zone}-3 ${label_occupied}"
          web_server:
            sorting_group_id: ld2450_group
        target_count:
          id: ld2450_zone_3_target_count
          name: "${label_zone}-3 ${label_count}"
          accuracy_decimals: 0
          web_server:
            sorting_group_id: ld2450_group

# Zone polygons, editable from Home Assistant as a single text field per zone, formatted as
# "x1,y1;x2,y2;x3,y3;..." in meters (at least 3 points, must describe a convex polygon). Defaults to
# an empty string, i.e. an inert/empty zone, until configured. X is positive to the sensor's right, Y
# is the distance in front of the sensor.
text:
  - platform: template
    id: ld2450_zone1_polygon
    name: LD2450 ${label_zone}-1 ${label_polygon}
    entity_category: config
    icon: mdi:vector-polygon
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255
    web_server:
      sorting_group_id: ld2450_group
  - platform: template
    id: ld2450_zone2_polygon
    name: LD2450 ${label_zone}-2 ${label_polygon}
    entity_category: config
    icon: mdi:vector-polygon
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255
    web_server:
      sorting_group_id: ld2450_group
  - platform: template
    id: ld2450_zone3_polygon
    name: LD2450 ${label_zone}-3 ${label_polygon}
    entity_category: config
    icon: mdi:vector-polygon
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 255
    web_server:
      sorting_group_id: ld2450_group

# Zone margins, editable from Home Assistant. The component only accepts margin at compile time, but
# set_margin() is a public method so we call it at runtime from on_value. Zone IDs are required for
# the lambda references. Value is in meters; 0.25m matches the component's built-in default (250mm).
number:
  - platform: template
    name: LD2450 ${label_zone}-1 ${label_margin}
    entity_category: config
    icon: mdi:arrow-expand
    unit_of_measurement: m
    initial_value: 0.25
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    optimistic: true
    restore_value: true
    on_value:
      - lambda: "id(ld2450_zone_1).set_margin(x);"
    web_server:
      sorting_group_id: ld2450_group
  - platform: template
    name: LD2450 ${label_zone}-2 ${label_margin}
    entity_category: config
    icon: mdi:arrow-expand
    unit_of_measurement: m
    initial_value: 0.25
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    optimistic: true
    restore_value: true
    on_value:
      - lambda: "id(ld2450_zone_2).set_margin(x);"
    web_server:
      sorting_group_id: ld2450_group
  - platform: template
    name: LD2450 ${label_zone}-3 ${label_margin}
    entity_category: config
    icon: mdi:arrow-expand
    unit_of_measurement: m
    initial_value: 0.25
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    optimistic: true
    restore_value: true
    on_value:
      - lambda: "id(ld2450_zone_3).set_margin(x);"
    web_server:
      sorting_group_id: ld2450_group

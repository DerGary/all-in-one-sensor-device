sensor:
  - platform: sgp4x
    voc:
      name: ${label_voc_index}
      icon: mdi:air-filter
      id: voc_index
      algorithm_tuning:
        # the documentation at states that 72h is optimal for indoor use: https://sensirion.com/media/documents/25AB572C/62B463AA/Sensirion_Engineering_Guidelines_SEN5x.pdf
        learning_time_gain_hours: 72
        learning_time_offset_hours: 72
    nox:
      name: ${label_nox_index}
      icon: mdi:smoke
      id: nox_index
      disabled_by_default: true
    compensation:
      humidity_source: humidity
      temperature_source: temperature

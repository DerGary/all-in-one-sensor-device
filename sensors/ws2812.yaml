light:
  - platform: esp32_rmt_led_strip
    id: status_led
    rgb_order: GRB
    chipset: WS2812
    pin: ${pin}
    num_leds: 1
    name: ${label_status_led}
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s
          update_interval: 0.5s
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          transition_length: 2s
          update_interval: 2s
          name: Slow Pulse
          min_brightness: 40%
      - strobe:
      - random:
      - flicker:

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    rgb_order: GRB
    chipset: WS2812
    pin: ${pin}
    num_leds: 1
    name: ${label_status_led}
    effects:
      - pulse:
      - pulse:
          transition_length: 2s
          update_interval: 2s
          name: Slow Pulse
          min_brightness: 40%
      - strobe:
      - random:
      - flicker:

switch:
  - platform: template
    id: air_quality_led_automation
    name: ${label_air_quality_led_automation}
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: True

globals:
  - id: air_quality_status_led_active
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: template
    id: voc_warning_active
    # WARNUNG: TVOC > 660 ppb for 5 min
    lambda: "return id(tvoc).state > 660;"
    filters:
      - delayed_on: 5min
      - delayed_off: 5min

  - platform: template
    id: voc_critical_active
    # KRITISCH: TVOC > 2200 ppb for 5 min
    lambda: "return id(tvoc).state > 2200;"
    filters:
      - delayed_on: 5min
      - delayed_off: 5min

interval:
  - interval: 1min
    then:
      - if:
          condition:
            lambda: "return id(air_quality_led_automation).state;"
          then:
            - lambda: |-
                float current_tvoc = id(tvoc).state;
                float current_co2 = id(co2).state;
                bool voc_warn_delayed = id(voc_warning_active).state;
                bool voc_crit_delayed = id(voc_critical_active).state;

                bool led_activated_by_automation = id(air_quality_status_led_active);
                bool led_is_on = id(status_led).current_values.is_on();

                // 1. Check for external override
                if (led_is_on && !led_activated_by_automation) return;

                // 2. IMMEDIATE RESET (Lüften-Erkennung)
                // If values are currently good, turn off immediately, 
                // ignoring the delayed sensors.
                if (current_tvoc < 220 && current_co2 < 1000) {
                  auto call = id(status_led).make_call();
                  call.set_state(false);
                  call.perform();
                  id(air_quality_status_led_active) = false;
                } 
                // 3. CRITICAL State (Red)
                else if (voc_crit_delayed || current_co2 > 2000) {
                  auto call = id(status_led).make_call();
                  call.set_rgb(1.0, 0.0, 0.0);
                  call.set_effect("Slow Pulse");
                  call.set_state(true);
                  call.perform();
                  id(air_quality_status_led_active) = true;
                } 
                // 4. WARNING State (Yellow)
                else if (voc_warn_delayed || current_co2 > 1250) {
                  auto call = id(status_led).make_call();
                  call.set_rgb(1.0, 0.7, 0.0);
                  call.set_effect("Slow Pulse");
                  call.set_state(true);
                  call.perform();
                  id(air_quality_status_led_active) = true;
                }

text_sensor:
  - platform: template
    name: ${label_air_quality}
    icon: "mdi:air-purifier"
    update_interval: 1min
    lambda: |-
      float current_tvoc = id(tvoc).state;
      float current_co2 = id(co2).state;
      bool is_warn_delayed = id(voc_warning_active).state;
      bool is_crit_delayed = id(voc_critical_active).state;

      // 1. CRITICAL
      if (is_crit_delayed || current_co2 > 2000) {
        return {"${label_aq_351}"}; 
      }

      // 2. WARNING
      if (is_warn_delayed || current_co2 > 1250) {
        return {"${label_aq_200}"};
      }

      // 3. EXCELLENT
      if (current_tvoc < 220 && current_co2 < 1000) {
        return {"${label_aq_50}"};
      }

      // 4. GOOD
      return {"${label_aq_100}"};
